<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KerjaDekat - Marketplace Jasa Lokal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Loading State -->
        <div id="loading" class="loading-overlay" style="display: none;">
            <div class="spinner"></div>
        </div>

        <!-- Auth Section -->
        <div id="authSection" class="auth-section">
            <!-- Login Form -->
            <div id="loginForm" class="form-container">
                <div class="form-header">
                    <h1 class="app-title">KerjaDekat</h1>
                    <p class="app-subtitle">Jasa Lokal Mudah & Cepat</p>
                </div>
                <form id="loginFormElement" class="form">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="nama@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Masuk</button>
                    <p class="form-footer">Belum punya akun? <a href="#" onclick="toggleAuth()">Daftar di sini</a></p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-container" style="display: none;">
                <div class="form-header">
                    <h1 class="app-title">KerjaDekat</h1>
                    <p class="app-subtitle">Daftar Gratis Sekarang</p>
                </div>
                <form id="registerFormElement" class="form">
                    <div class="form-group">
                        <label for="fullName">Nama Lengkap</label>
                        <input type="text" id="fullName" placeholder="Nama Anda" required>
                    </div>
                    <div class="form-group">
                        <label for="whatsapp">Nomor WhatsApp</label>
                        <input type="tel" id="whatsapp" placeholder="62812345678" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" placeholder="nama@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="location">Lokasi</label>
                        <input type="text" id="location" placeholder="Nama Kota/Kelurahan" required>
                    </div>
                    <div class="form-group">
                        <label for="jobCategory">Kategori Pekerjaan</label>
                        <select id="jobCategory" required>
                            <option value="">-- Pilih Kategori --</option>
                            <option value="pembersih">Pembersih Rumah</option>
                            <option value="angkut">Angkut Barang</option>
                            <option value="potong-rumput">Potong Rumput</option>
                            <option value="cuci-motor">Cuci Motor</option>
                            <option value="servis-elektronik">Servis Elektronik</option>
                            <option value="pindahan">Bantu Pindahan</option>
                            <option value="les-privat">Les Privat</option>
                            <option value="kurir">Kurir Lokal</option>
                            <option value="lainnya">Lainnya</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Daftar</button>
                    <p class="form-footer">Sudah punya akun? <a href="#" onclick="toggleAuth()">Masuk di sini</a></p>
                </form>
            </div>
        </div>

        <!-- Main App Section -->
        <div id="mainApp" class="main-app" style="display: none;">
            <!-- Sidebar -->
            <div id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <button class="sidebar-close" onclick="closeSidebar()">×</button>
                </div>
                <nav class="sidebar-nav">
                    <a href="#" onclick="showPage('home', event)" class="nav-item">
                        <span class="nav-icon">🏠</span>
                        <span>Beranda</span>
                    </a>
                    <a href="#" onclick="showPage('createJob', event)" class="nav-item">
                        <span class="nav-icon">➕</span>
                        <span>Buat Jasa</span>
                    </a>
                    <a href="#" onclick="showPage('searchJob', event)" class="nav-item">
                        <span class="nav-icon">🔍</span>
                        <span>Cari Jasa</span>
                    </a>
                    <a href="#" onclick="showPage('profile', event)" class="nav-item">
                        <span class="nav-icon">👤</span>
                        <span>Profil</span>
                    </a>
                    <hr class="nav-divider">
                    <a href="#" onclick="logout(event)" class="nav-item nav-logout">
                        <span class="nav-icon">🚪</span>
                        <span>Keluar</span>
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Header -->
                <div class="app-header">
                    <button class="menu-btn" onclick="openSidebar()">☰</button>
                    <h1 class="header-title">KerjaDekat</h1>
                    <div class="header-spacer"></div>
                </div>

                <!-- Home Page -->
                <div id="homePage" class="page active">
                    <div class="page-header">
                        <h2>Jasa Terdekat</h2>
                    </div>
                    <div id="jobFeed" class="job-feed">
                        <!-- Job cards akan di-load di sini -->
                    </div>
                    <div id="emptyFeed" class="empty-state" style="display: none;">
                        <div class="empty-icon">🗑️</div>
                        <p>Belum ada jasa tersedia</p>
                    </div>
                </div>

                <!-- Create Job Page -->
                <div id="createJobPage" class="page" style="display: none;">
                    <div class="page-header">
                        <h2>Buat Jasa Baru</h2>
                    </div>
                    <form id="createJobForm" class="form">
                        <div class="form-group">
                            <label for="jobTitle">Judul Jasa</label>
                            <input type="text" id="jobTitle" placeholder="Misal: Bersihkan Rumah" required>
                        </div>
                        <div class="form-group">
                            <label for="jobDescription">Deskripsi</label>
                            <textarea id="jobDescription" placeholder="Jelaskan detail jasa yang Anda tawarkan" rows="4" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="jobPrice">Harga (Rp)</label>
                            <input type="number" id="jobPrice" placeholder="50000" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="jobLocation">Lokasi</label>
                            <input type="text" id="jobLocation" placeholder="Kota/Kelurahan" required>
                        </div>
                        <div class="form-group">
                            <label for="jobCategoryCreate">Kategori</label>
                            <select id="jobCategoryCreate" required>
                                <option value="">-- Pilih Kategori --</option>
                                <option value="pembersih">Pembersih Rumah</option>
                                <option value="angkut">Angkut Barang</option>
                                <option value="potong-rumput">Potong Rumput</option>
                                <option value="cuci-motor">Cuci Motor</option>
                                <option value="servis-elektronik">Servis Elektronik</option>
                                <option value="pindahan">Bantu Pindahan</option>
                                <option value="les-privat">Les Privat</option>
                                <option value="kurir">Kurir Lokal</option>
                                <option value="lainnya">Lainnya</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Posting Jasa</button>
                    </form>
                </div>

                <!-- Search Job Page -->
                <div id="searchJobPage" class="page" style="display: none;">
                    <div class="page-header">
                        <h2>Cari Jasa</h2>
                    </div>
                    <div class="search-container">
                        <input type="text" id="searchInput" placeholder="Cari jasa..." class="search-input">
                    </div>
                    <div id="searchResults" class="job-feed">
                        <!-- Search results akan di-load di sini -->
                    </div>
                </div>

                <!-- Profile Page -->
                <div id="profilePage" class="page" style="display: none;">
                    <div class="page-header">
                        <h2>Profil Saya</h2>
                    </div>
                    <div id="profileContent" class="profile-container">
                        <!-- Profile content akan di-load di sini -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <!-- Firebase SDK COMPAT -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    </script>

    <script src="app.js"></script>
</body>
</html>
